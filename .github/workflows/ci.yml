name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend — pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile all backend modules
        run: python -m compileall -q app

      - name: Run tests (offline, deterministic)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

  dependency-audit:
    name: Dependency audit — pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + audit tooling
        run: |
          python -m pip install --upgrade pip   # also fixes PYSEC-2026-3721 (pip < 26.2)
          pip install -r requirements-dev.txt

      - name: Audit runtime + dev dependencies
        run: pip-audit --strict --progress-spinner off -r requirements-dev.txt

  extension-syntax:
    name: Extension — node --check + manifest validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check all extension scripts
        run: |
          node --check content.js
          node --check background.js
          node --check popup.js
          node --check options.js

      - name: Validate manifest.json (parse + MV3 essentials)
        run: |
          node -e "
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const fail = (msg) => { console.error('MANIFEST FAIL:', msg); process.exit(1); };
          if (m.manifest_version !== 3) fail('must be MV3');
          for (const k of ['name', 'version', 'background', 'action']) if (!(k in m)) fail('missing ' + k);
          if (m.background.service_worker !== 'background.js') fail('unexpected service worker entry');
          const banned = ['tabs', 'cookies', 'history', 'webRequest', 'downloads', 'bookmarks', 'management', 'debugger', 'proxy', 'privacy'];
          const perms = m.permissions || [];
          for (const p of banned) if (perms.includes(p)) fail('banned permission: ' + p);
          if (JSON.stringify(m.permissions).includes('<all_urls>') || JSON.stringify(m.host_permissions).includes('<all_urls>')) fail('<all_urls> is forbidden');
          const allowedHosts = (m.host_permissions || []).every((h) => /^https?:\/\/(localhost|127\.0\.0\.1)(\/.*)?$/.test(h));
          if (!allowedHosts) fail('host_permissions outside localhost are not allowed without review');
          console.log('manifest OK — MV3, least-privilege permissions verified');
          "

      - name: Fail on dangerous JS patterns (eval / Function / inline HTML sinks)
        # Strip // comments first so documentation ("no innerHTML anywhere")
        # doesn't false-positive; string literals with '//' (URLs) don't
        # contain the audited patterns.
        run: |
          for f in *.js; do
            sed -E 's@//.*$@@' "$f" > /tmp/stripped.js
            if grep -nE "\beval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\(" /tmp/stripped.js; then
              echo "DANGEROUS: eval/new Function in $f"; exit 1
            fi
            if grep -nE "innerHTML|outerHTML|insertAdjacentHTML" /tmp/stripped.js; then
              echo "DANGEROUS: HTML injection sink in $f"; exit 1
            fi
          done
          echo "no dangerous JS patterns found"
