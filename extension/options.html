<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; max-width: 460px; margin: 24px auto; padding: 0 16px; }
      h1 { font-size: 18px; }
      label { display: block; margin-top: 14px; font-size: 13px; font-weight: 600; }
      select, input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #cfd8dc; border-radius: 6px; font-size: 13px; }
      button { margin-top: 16px; padding: 8px 16px; border: 0; border-radius: 8px; background: #1a237e; color: #fff; cursor: pointer; }
      .hint { font-size: 12px; color: #607d8b; margin-top: 4px; }
      #saved { color: #2e7d32; font-size: 13px; margin-left: 10px; }
    </style>
  </head>
  <body>
    <h1>🛡️ Veritas settings</h1>

    <label for="region">Your region (trusted sources)</label>
    <select id="region">
      <option value="in">India — TOI, India Today, The Hindu, NDTV…</option>
      <option value="us">United States — Reuters, AP, NYT, NPR…</option>
      <option value="uk">United Kingdom — BBC, Guardian, FT…</option>
      <option value="global">Global — Reuters, AP, BBC, Al Jazeera…</option>
    </select>
    <div class="hint">Stories are cross-checked against these outlets for corroboration.</div>

    <label for="backend">Backend URL</label>
    <input id="backend" type="url" placeholder="http://localhost:8000" />
    <div class="hint">Where the analysis API runs. Default: local dev server.</div>

    <label for="apiKey">API key (optional)</label>
    <input id="apiKey" type="password" placeholder="vfnd_…" autocomplete="off" />
    <div class="hint">Required if the backend has authentication enabled. Stored locally on this
      device only — never synced, never sent anywhere except your backend.</div>

    <label><input type="checkbox" id="autoCheck" style="width:auto" /> Auto-check pages that look like news</label>

    <button id="save">Save</button><span id="saved"></span>
    <script src="options.js"></script>
  </body>
</html>
